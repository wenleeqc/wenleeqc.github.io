<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Good Apple Case Study</title>
</head>
<body class="roboto-font">

    <main>
        <section id="landing">
            <div class="landing-logo-container">
                <img class="landing-logo" src="/assets/landing-good-apple-logo.svg" alt="good apple logo.">
                <div id="landing-logo-text">
                    <div class="landing-logo-ux-text roboto-serif-font">UX/UI</div>
                    <div class="landing-logo-case-study-text roboto-serif-font">CASE STUDY</div>
                </div>
            </div>
            <img class="landing-logomark" src="/assets/landing-good-apple-logomark.svg" alt="good apple logomark.">
            <p class="landing-text">We are building a <b class="roboto-serif-font">community</b>,<br>
                connecting <b class="roboto-serif-font">teachers</b> and<br>
                allowing them to <b class="roboto-serif-font">support</b> each<br>
                other's classrooms.</p>
            <img class="landing-line" src="/assets/landing-line.svg" alt="swiggly line">
        </section>

        <section id="problem"></section>

        <section id="competitive-analysis"></section>

        <section id="user-persona"></section>

        <section id="wireframes"></section>

        <section id="design-system"></section>

        <section id="user-story"></section>
    </main>

    
    
</body>
</html>
